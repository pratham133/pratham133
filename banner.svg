<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="45%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2bd6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9be8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9be8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="55%" stop-color="#9b8cff"/>
      <stop offset="100%" stop-color="#ff6ec7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- distant skyline silhouettes -->
  <g opacity="0.5" fill="#0a0f1f">
    <rect x="0" y="230" width="40" height="90"/>
    <rect x="50" y="200" width="28" height="120"/>
    <rect x="90" y="240" width="50" height="80"/>
    <rect x="150" y="180" width="22" height="140"/>
    <rect x="1100" y="210" width="30" height="110"/>
    <rect x="1140" y="190" width="24" height="130"/>
    <rect x="1175" y="235" width="46" height="85"/>
    <rect x="1230" y="200" width="30" height="120"/>
  </g>

  <!-- moon -->
  <circle cx="1070" cy="80" r="95" fill="url(#moonGlow)"/>
  <circle cx="1070" cy="80" r="42" fill="#e9f6ff" opacity="0.92"/>
  <circle cx="1070" cy="80" r="42" fill="none" stroke="#7df9ff" stroke-width="1" opacity="0.4"/>

  <!-- circuit lines, low opacity -->
  <g stroke="#3fd4ff" stroke-width="1" fill="none" opacity="0.35">
    <path d="M0 60 H120 V100 H260"/>
    <path d="M260 100 V40 H420"/>
    <path d="M40 280 H180 V250 H300 V300 H460"/>
    <path d="M900 280 H1020 V250"/>
    <path d="M1180 250 V150 H1280"/>
    <circle cx="120" cy="60" r="3" fill="#3fd4ff"/>
    <circle cx="260" cy="100" r="3" fill="#3fd4ff"/>
    <circle cx="420" cy="40" r="3" fill="#3fd4ff"/>
    <circle cx="300" cy="250" r="3" fill="#3fd4ff"/>
    <circle cx="1020" cy="250" r="3" fill="#3fd4ff"/>
    <circle cx="1180" cy="150" r="3" fill="#3fd4ff"/>
  </g>

  <!-- katana-esque accent slashes (anime motif, abstract not character) -->
  <path d="M30 280 L 250 60" stroke="url(#glow1)" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 300 L 280 80" stroke="url(#glow1)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M950 300 L 1230 40" stroke="url(#glow2)" stroke-width="3" stroke-linecap="round"/>
  <path d="M980 320 L 1260 60" stroke="url(#glow2)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- main title -->
  <text x="640" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#textGrad)" letter-spacing="2">PRATHAM PASI</text>
  <text x="640" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d6f5" letter-spacing="4">EDGE AI ENGINEER  ·  AI/ML &amp; AGENTIC SYSTEMS</text>

  <!-- code-style accent line -->
  <text x="640" y="230" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#6ee7ff" opacity="0.85">&lt;hardware /&gt; → &lt;cloud /&gt; → &lt;agents /&gt;</text>

  <!-- bottom thin divider glow -->
  <rect x="340" y="260" width="600" height="2" fill="url(#textGrad)" opacity="0.6"/>
</svg>
